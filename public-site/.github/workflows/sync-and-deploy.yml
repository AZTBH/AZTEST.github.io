name: Sync Private Assets and Deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the PUBLIC repository
      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          path: public-site

      # 2. Checkout the PRIVATE repository
      - name: Checkout private repository
        uses: actions/checkout@v7
        with:
          repository: AZTBH/AZTEST.github.io
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-assets

      # 3. Copy private CSS into the public repository
      - name: Sync CSS
        run: |
          rm -rf public-site/css
          mkdir -p public-site/css

          cp -R private-assets/css/. public-site/css/

      # 4. Commit the copied CSS into the public repository
      - name: Commit updated CSS
        working-directory: public-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add css/

          if git diff --cached --quiet; then
            echo "No CSS changes detected."
          else
            git commit -m "Sync CSS from private repository"
            git push
          fi

      # 5. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Upload the public website
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

      # 7. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
